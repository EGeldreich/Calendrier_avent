<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
    
    <title>Calendrier de l'avent</title>
</head>
<body>
    <div class="filter">
        <header>
            <div>
                <h1>Calendrier de l'avent</h1>
                <button class="reset">Rénitialiser</button>
            </div>
            <h2 class="days-left"></h2>
        </header>
        <main>
            <div class="calendar-container">
                <template id="box-template">
                    <button class="box not-yet">
                        <div class="vertical-ribbon"></div>
                        <div class="horizontal-ribbon"></div>
                    </button>
                </template>
            </div>
        </main>
    </div>
</body>
</html>
